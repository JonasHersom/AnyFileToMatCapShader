<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnyFileToMatCapShader</title>
  <link rel="stylesheet" href="/src/style.css">
  <style>
    /* App-specific overrides */
    body { overflow: hidden; }
    main { max-width: none; padding: 0; }
    canvas { border: none; width: 100%; height: 100%; display: block; }
    
    /* Overlay UI */
    #ui-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
    }
    #ui-overlay > * { pointer-events: auto; }
    
    /* Top bar */
    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    #top-bar h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }
    #top-bar h1 small { font-weight: 400; font-size: 0.7em; color: #5b6475; margin-left: 8px; }
    
    /* Side panel */
    #side-panel {
      position: fixed;
      top: 60px; right: 16px; bottom: 16px;
      width: 280px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .panel-section { display: flex; flex-direction: column; gap: 8px; }
    .panel-section h3 { margin: 0 0 8px; font-size: 0.85rem; font-weight: 600; color: #3d4556; text-transform: uppercase; letter-spacing: 0.5px; }
    
    /* Drop zone */
    #drop-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    #drop-zone:hover, #drop-zone.drag-over {
      border-color: var(--accent);
      background: #eef3fb;
    }
    #drop-zone p { margin: 0; font-size: 0.9rem; color: #5b6475; }
    #drop-zone small { color: #8a94a6; }
    
    /* Model selector */
    #model-select { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; background: white; }
    
    /* MatCap controls */
    .control-row { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; }
    .control-row label { display: flex; flex-direction: column; gap: 2px; }
    .control-row input[type="range"] { width: 100%; }
    .control-row output { color: #5b6475; font-size: 0.8rem; }
    
    /* Export button */
    #export-btn {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: auto;
    }
    #export-btn:hover { filter: brightness(1.1); }
    #export-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    /* Status */
    #status-bar {
      position: fixed;
      bottom: 16px; left: 16px; right: 312px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-family: monospace;
    }
    #status-bar.hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <canvas id="canvas"></canvas>
    
    <div id="ui-overlay">
      <!-- Top bar -->
      <header id="top-bar">
        <h1>AnyFileToMatCapShader <small>WebGPU</small></h1>
        <div style="display: flex; gap: 8px;">
          <span id="fps-counter" style="font-size: 0.8rem; color: #5b6475; font-family: monospace;"></span>
        </div>
      </header>
      
      <!-- Side panel -->
      <aside id="side-panel">
        <!-- File drop zone -->
        <section class="panel-section">
          <h3>Input File</h3>
          <div id="drop-zone">
            <p>Drag & drop any file</p>
            <small>or click to browse</small>
            <input type="file" id="file-input" style="display: none;">
          </div>
        </section>
        
        <!-- Model selector -->
        <section class="panel-section">
          <h3>3D Model</h3>
          <select id="model-select">
            <option value="builtin:sphere">Sphere (built-in)</option>
            <option value="builtin:torus-knot">Torus Knot (built-in)</option>
            <option value="builtin:bunny">Bunny (built-in)</option>
            <option value="builtin:cube">Cube (built-in)</option>
            <option value="builtin:plane">Plane (built-in)</option>
            <option value="uploaded">Upload .obj / .glb…</option>
          </select>
        </section>
        
        <!-- MatCap options -->
        <section class="panel-section">
          <h3>MatCap Generation</h3>
          <div class="control-row">
            <label>Method
              <select id="matcap-method">
                <option value="hybrid">Hybrid (default)</option>
                <option value="spherical-fit">Spherical Fit</option>
                <option value="lighting-analysis">Lighting Analysis</option>
              </select>
            </label>
          </div>
          <div class="control-row">
            <label>Resolution: <output id="matcap-res-out">512</output>
              <input type="range" id="matcap-resolution" min="128" max="1024" step="64" value="512">
            </label>
          </div>
          <div class="control-row">
            <label>
              <input type="checkbox" id="matcap-contrast"> Enhance Contrast
            </label>
          </div>
        </section>
        
        <!-- Export -->
        <button id="export-btn" disabled>Export Rendered Image</button>
      </aside>
      
      <!-- Status bar -->
      <div id="status-bar" class="hidden">Ready. Drop a file to begin.</div>
    </div>
  </main>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
